const communityColors = ["#6366f1", "#06b6d4", "#ec4899", "#10b981", "#f59e0b"];
const communityNames = [
  "Core & Service Lifecycle",
  "Overlay Framework & Window Management",
  "Interactive Overlay Components (FAB, Touchpad, Tenkey)",
  "Persistence & Preference Settings",
  "Utilities, System Helpers & Haptics"
];

const width = window.innerWidth;
const height = window.innerHeight;
const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.1, 4]).on("zoom", (e) => g.attr("transform", e.transform)));

const simulation = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links).id(d => d.id).distance(d => d.confidence === "EXTRACTED" ? 45 : 75))
  .force("charge", d3.forceManyBody().strength(d => d.label.startsWith(".") ? -60 : -320))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => d.label.startsWith(".") ? 12 : 28));

const link = g.append("g")
  .selectAll("line")
  .data(data.links)
  .join("line")
  .attr("class", d => "link " + (d.confidence ? d.confidence.toLowerCase() : ""));

const node = g.append("g")
  .selectAll("g")
  .data(data.nodes)
  .join("g")
  .attr("class", d => "node " + (d.label.startsWith(".") ? "is-func" : "is-class"))
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
  .on("click", (e, d) => {
    const sb = document.getElementById("sidebar");
    sb.style.display = "block";
    document.getElementById("side-title").innerText = d.label;
    document.getElementById("side-file").innerText = d.source_file + " (" + d.source_location + ")";
    document.getElementById("side-community").innerText = communityNames[d.community] || ("Community " + d.community);
    const badge = document.getElementById("side-badge");
    badge.innerText = d.label.startsWith(".") ? "METHOD / FUNCTION" : "CLASS / COMPONENT";
    badge.style.background = communityColors[d.community];
    badge.style.color = "#fff";
  });

node.append("circle")
  .attr("r", d => d.label.startsWith(".") ? 5 : 12)
  .attr("fill", d => communityColors[d.community] || "#a1a1aa");

node.append("text")
  .attr("dx", d => d.label.startsWith(".") ? 8 : 15)
  .attr("dy", 3)
  .text(d => d.label);

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
