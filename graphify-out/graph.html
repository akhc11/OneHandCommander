const communityColors = ['#6366f1', '#06b6d4', '#ec4899', '#10b981', '#f59e0b'];
const communityNames = [
  'Core & Service Lifecycle',
  'Interactive Overlay Components & App Menu',
  'Ultra-Fast Pure Canvas Direct Drawables',
  'Persistence & Settings Domain',
  'Utilities, System Helpers & Caching'
];

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select('svg')
  .attr('viewBox', [-width / 2, -height / 2, width, height]);

const g = svg.append('g');

svg.call(d3.zoom()
  .scaleExtent([0.1, 4])
  .on('zoom', (e) => g.attr('transform', e.transform)));

const simulation = d3.forceSimulation(data.nodes)
  .force('link', d3.forceLink(data.links).id(d => d.id).distance(90))
  .force('charge', d3.forceManyBody().strength(-350))
  .force('center', d3.forceCenter(0, 0))
  .force('collision', d3.forceCollide().radius(28));

const link = g.append('g')
  .selectAll('line')
  .data(data.links)
  .join('line')
  .attr('class', d => 'link ' + (d.relation || ''));

const node = g.append('g')
  .selectAll('g')
  .data(data.nodes)
  .join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', dragstarted)
    .on('drag', dragged)
    .on('end', dragended));

node.append('circle')
  .attr('r', 12)
  .attr('fill', d => communityColors[d.community % communityColors.length]);

node.append('text')
  .attr('x', 16)
  .attr('y', 4)
  .text(d => d.id);

node.on('click', (event, d) => {
  event.stopPropagation();
  showSidebar(d);
});

svg.on('click', () => {
  document.getElementById('sidebar').style.display = 'none';
});

function showSidebar(d) {
  const sidebar = document.getElementById('sidebar');
  sidebar.style.display = 'block';
  document.getElementById('side-title').innerText = d.label || d.id;
  document.getElementById('side-file').innerText = (d.source_file || '') + ' ' + (d.source_location || '');
  
  const badge = document.getElementById('side-badge');
  badge.style.background = communityColors[d.community % communityColors.length] + '22';
  badge.style.color = communityColors[d.community % communityColors.length];
  badge.innerText = 'Community ' + d.community;
  document.getElementById('side-community').innerText = communityNames[d.community] || ('Community ' + d.community);

  const outList = document.getElementById('side-out');
  const inList = document.getElementById('side-in');
  outList.innerHTML = '';
  inList.innerHTML = '';

  const outLinks = data.links.filter(l => (l.source.id || l.source) === d.id);
  const inLinks = data.links.filter(l => (l.target.id || l.target) === d.id);

  document.getElementById('side-out-count').innerText = outLinks.length;
  document.getElementById('side-in-count').innerText = inLinks.length;

  outLinks.forEach(l => {
    const li = document.createElement('li');
    li.innerText = '→ ' + (l.target.id || l.target) + ' (' + l.relation + ')';
    outList.appendChild(li);
  });

  inLinks.forEach(l => {
    const li = document.createElement('li');
    li.innerText = '← ' + (l.source.id || l.source) + ' (' + l.relation + ')';
    inList.appendChild(li);
  });
}

simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);

  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x;
  d.fy = d.y;
}

function dragged(event, d) {
  d.fx = event.x;
  d.fy = event.y;
}

function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null;
  d.fy = null;
}
</script>
</body>
